<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi Satgas Smantiara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="https://ucarecdn.com/382b5c5d-8bae-48d2-b42d-f22a93bbff77/468556946_545462784956500_3658096931176580766_n.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cover bg-center min-h-screen font-inter" style="background-image: url('https://6afuiqe8xb.ucarecd.net/745d6e45-2916-4c65-990f-39e4fedd3b23/unnamed.webp');">

    <div class="container mx-auto px-6 py-12">
        <div class="max-w-4xl mx-auto">
            
            <!-- Welcome Card -->
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 mb-8">
                <div class="flex justify-center mb-5">
                    <img src="https://ucarecdn.com/382b5c5d-8bae-48d2-b42d-f22a93bbff77/468556946_545462784956500_3658096931176580766_n.jpg" width="100px" height="auto" class="rounded-full" alt="">
                </div>
                <div class="text-center">
                    <h2 class="text-xl font-bold text-slate-800 mb-3">Selamat Datang di Portal Presensi SATGAS SMANTIARA</h2>
                </div>
                
                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center mt-8">
                    <a href="/attendance" class="group relative overflow-hidden bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-4 px-8 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                        <div class="absolute inset-0 bg-gradient-to-r from-blue-700 to-indigo-700 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
                        <span class="relative flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Menuju Presensi
                        </span>
                    </a>
                    
                </div>
            </div>

            <!-- Search Section -->
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                <!-- Header -->
                <div class="bg-gradient-to-r from-slate-800 to-slate-700 px-8 py-6">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-slate-300 text-sm">Cari riwayat data presensi anggota satgas</p>
                        </div>
                    </div>
                </div>
                
                <!-- Search Form -->
                <div class="p-8">
                    <div class="flex flex-col sm:flex-row gap-3">
                        <div class="flex-1 relative">
                            <input 
                                type="text" 
                                id="searchInput" 
                                placeholder="Masukkan nama" 
                                class="w-full px-6 py-4 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all duration-200 text-slate-700 placeholder-slate-400"
                            >
                            <div class="absolute inset-y-0 right-0 flex items-center pr-6 pointer-events-none">
                                <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                        </div>
                        <button 
                            id="searchButton" 
                            class="group bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold px-8 py-4 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 hover:-translate-y-0.5"
                        >
                            <span class="flex items-center gap-2">
                                <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                                Cari Data
                            </span>
                        </button>
                    </div>
                    
                    <!-- Search Results -->
                    <div id="searchResults" class="mt-8">
                        <div class="text-center py-12">
                            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                            </div>
                            <p class="text-slate-500 text-lg">Masukkan nama untuk mencari data presensi</p>
                            <p class="text-slate-400 text-sm mt-1">Minimal 3 karakter diperlukan</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center mt-12 pb-8">
                <p class="text-slate-500 text-sm">© 2025 Sistem Presensi Satgas Smantiara </p>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const searchResults = document.getElementById('searchResults');

        const performSearch = async () => {
            const name = searchInput.value.trim();
            if (name.length < 3) {
                searchResults.innerHTML = `
                    <div class="text-center py-8">
                        <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-3">
                            <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                        </div>
                        <p class="text-slate-600 font-medium">Masukkan minimal 3 karakter untuk mencari</p>
                    </div>
                `;
                return;
            }

            searchResults.innerHTML = `
                <div class="text-center py-8">
                    <div class="inline-flex items-center gap-3 text-blue-600">
                        <div class="animate-spin w-6 h-6 border-2 border-blue-600 border-t-transparent rounded-full"></div>
                        <span class="font-medium">Mencari data...</span>
                    </div>
                </div>
            `;

           try {
    const response = await fetch(`/api/search?name=${encodeURIComponent(name)}`);
    const data = await response.json();

    // Helper function untuk menampilkan pesan error/kosong
    const showMessage = (iconPath, title, message) => {
        return `
            <div class="text-center py-12 px-4">
                <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="${iconPath}" />
                </svg>
                <h3 class="mt-3 text-lg font-semibold text-slate-800">${title}</h3>
                <p class="mt-1 text-sm text-slate-500">${message}</p>
            </div>
        `;
    };

    if (response.ok) {
        if (data.length > 0) {
            let html = '<div class="space-y-3">';
            data.forEach(rec => {
                // Konfigurasi status (Hadir atau Terlambat)
                const isPresent = rec.status === 'Hadir';
                const statusConfig = isPresent 
                    ? { bg: 'bg-emerald-50', text: 'text-emerald-700', icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' }
                    : { bg: 'bg-amber-50', text: 'text-amber-700', icon: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z' };
                
                // --- STRUKTUR HTML YANG DIOPTIMALKAN ---
                html += `
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm transition-all hover:border-blue-400">
                        <div class="flex justify-between items-start gap-4">
                            <div>
                                <h4 class="font-semibold text-slate-800">${rec.full_name}</h4>
                                <p class="text-sm text-slate-500 mt-1">${rec.student_class} &bull; ${rec.division}</p>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <div class="inline-flex items-center gap-1.5 ${statusConfig.bg} ${statusConfig.text} px-2.5 py-1 rounded-full text-xs font-bold">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${statusConfig.icon}"></path>
                                    </svg>
                                    <span>${rec.status}</span>
                                </div>
                                <p class="text-xs text-slate-400 mt-1.5">${rec.formatted_date}</p>
                            </div>
                        </div>
                    </div>`;
            });
            html += '</div>';
            searchResults.innerHTML = html;
        } else {
            // Tampilan jika data tidak ditemukan
            const notFoundIcon = "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z";
            searchResults.innerHTML = showMessage(notFoundIcon, 'Data Tidak Ditemukan', 'Tidak ada riwayat presensi yang cocok dengan pencarian Anda.');
        }
    } else {
        // Tampilan jika terjadi error dari server
        const errorIcon = "M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z";
        searchResults.innerHTML = showMessage(errorIcon, 'Gagal Mengambil Data', data.error || 'Terjadi masalah pada server.');
    }
} catch (error) {
    // Tampilan jika terjadi kesalahan jaringan
    const networkErrorIcon = "M18.364 5.636l-12.728 12.728m0-12.728l12.728 12.728";
    searchResults.innerHTML = showMessage(networkErrorIcon, 'Terjadi Kesalahan Jaringan', 'Periksa koneksi internet Anda dan coba lagi.');
}
        };
        
        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                performSearch();
            }
        });
    </script>

</body>
</html>
