<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin Absensi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="shortcut icon" href="https://ucarecdn.com/ac8a536b-ee74-49e2-92af-5d256d7856ef/Satgas2025.png"
        type="image/x-icon">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .toggle-checkbox {
            left: 0;
            transition: all 0.2s ease-in-out;
        }

        .toggle-label {
            transition: background-color 0.2s ease-in-out;
        }

        .toggle-checkbox:checked {
            left: calc(100% - 1.5rem);
            border-color: #4f46e5;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #4f46e5;
        }

        #qr-reader {
            border: 2px dashed #cbd5e1;
            border-radius: 0.75rem;
            min-height: 280px;
            background: #f8fafc;
        }

        @media (min-width: 640px) {
            #qr-reader {
                min-height: 320px;
            }
        }

        #qr-reader__dashboard_section_swaplink,
        #qr-reader__dashboard_section_fsr {
            display: none !important;
        }

        .status-badge {
            padding: 0.375rem 0.875rem;
            border-radius: 9999px;
            font-size: 0.813rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        .status-hadir {
            background-color: #dcfce7;
            color: #166534;
        }

        .status-tugas-pagi {
            background-color: #cffafe;
            color: #0891b2;
        }

        .status-izin,
        .status-sakit {
            background-color: #fef3c7;
            color: #92400e;
        }

        .status-belum-hadir {
            background-color: #fce7f3;
            color: #be185d;
        }

        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mobile Optimizations */
        @media (max-width: 640px) {
            .mobile-scroll {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            table {
                font-size: 0.875rem;
            }

            .status-badge {
                font-size: 0.75rem;
                padding: 0.25rem 0.625rem;
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">

    <div class="p-3 sm:p-4 md:p-6 lg:p-8 max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6 sm:mb-8 bg-white p-4 sm:p-5 rounded-xl shadow-sm">
            <div>
                <h1 class="text-lg sm:text-xl md:text-2xl font-bold text-gray-800">Hello Admin!</h1>
                <p class="text-xs sm:text-sm text-gray-500 mt-0.5">Dashboard Kehadiran Siswa</p>
            </div>

            <nav class="hidden sm:flex items-center gap-2">
                <a href="/generate"
                    class="bg-blue-600 text-white font-semibold py-2.5 px-4 rounded-lg hover:bg-blue-700 transition text-sm">Generate
                    QR</a>
                <a href="/documentation"
                    class="bg-blue-600 text-white font-semibold py-2.5 px-4 rounded-lg hover:bg-blue-700 transition text-sm">Dokumentasi</a>
                <button id="logoutButton"
                    class="bg-red-600 text-white font-semibold py-2.5 px-4 rounded-lg hover:bg-red-700 transition text-sm">Logout</button>
            </nav>

            <div class="sm:hidden">
                <button id="menu-btn"
                    class="p-2.5 rounded-lg bg-gray-100 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <svg class="w-6 h-6 text-gray-700" fill="none" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
                        <path d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div id="mobile-menu"
            class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50">
            <div class="flex justify-between items-center p-5 border-b">
                <h2 class="font-bold text-gray-800 text-lg">Menu</h2>
                <button id="close-btn" class="p-2 hover:bg-gray-100 rounded-lg transition">
                    <svg class="w-6 h-6 text-gray-800" fill="none" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
                        <path d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <nav class="flex flex-col p-5 space-y-3">
                <a href="/generate"
                    class="text-gray-700 hover:bg-blue-50 py-3 px-4 rounded-lg transition font-medium">Generate QR</a>
                <a href="/documentation"
                    class="text-gray-700 hover:bg-blue-50 py-3 px-4 rounded-lg transition font-medium">Dokumentasi</a>
                <button id="logoutButtonMobile"
                    class="bg-red-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-red-700 transition mt-3">Logout</button>
            </nav>
        </div>

        <script>
            const menuBtn = document.getElementById('menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            const closeBtn = document.getElementById('close-btn');
            const logoutButtonMobile = document.getElementById('logoutButtonMobile');

            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.remove('translate-x-full');
            });

            closeBtn.addEventListener('click', () => {
                mobileMenu.classList.add('translate-x-full');
            });
        </script>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6 lg:gap-8">
            <div class="lg:col-span-1 bg-white p-5 sm:p-6 rounded-xl shadow-lg h-fit space-y-5 sm:space-y-6">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-100 p-2 rounded-lg">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4">

                    </div>
                    <h2 class="text-lg sm:text-xl font-bold text-gray-800">Panel Kontrol</h2>

                <div class="space-y-4 pt-4 border-t">
                    <div class="flex items-center gap-2 mb-3">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z">

                    <div id="qr-reader" class="w-full bg-gray-50 rounded-xl"></div>
                    <p id="scanner-info" class="text-center text-sm text-gray-500 font-medium py-2">Kamera tidak aktif.

                    <button id="scan-button"

                        <span class="flex items-center justify-center gap-2">

                        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                        Sesi Pindai QR

                    <div class="flex items-center justify-between bg-white p-3 rounded-lg">
                        <span id="session-status-text" class="font-medium text-gray-700 text-sm sm:text-base">Sesi

                        <div class="relative inline-block w-12 align-middle">
                            <input type="checkbox" id="presence-toggle"

                            <label for="presence-toggle"

                    </div>

                <div
                    class="bg-gradient-to-br from-gray-50 to-gray-100 p-4 sm:p-5 rounded-xl border border-gray-200 space-y-4">
                    <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                            </path>
                        </svg>

                    </h3>
                    <div class="hidden flex items-center justify-between bg-white p-3 rounded-lg">
                        <label for="keamanan-toggle" class="font-medium text-gray-700 text-sm sm:text-base">Presensi

                        <div class="relative inline-block w-12 align-middle"><input type="checkbox" id="keamanan-toggle"

                    <div class="flex items-center justify-between bg-white p-3 rounded-lg">
                        <label for="izin-toggle" class="font-medium text-gray-700 text-sm sm:text-base">Presensi

                        <div class="relative inline-block w-12 align-middle"><input type="checkbox" id="izin-toggle"
                                class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" /><label

                                class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>

                    <div class="text-xs sm:text-sm text-gray-600 space-y-2 pt-3 border-t">
                        <p class="hidden"><button
                                class="copy-btn font-mono text-indigo-600 hover:text-indigo-700 font-medium"
                                data-link="/presensi-kamtibsis">📋 Presensi kamtibsis</button></p>
                        <p class="flex items-start gap-2">
                            <span class="text-gray-500">Bagikan:</span>
                            <button
                                class="copy-btn font-mono text-indigo-600 hover:text-indigo-700 font-medium break-all text-left"

                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white p-5 sm:p-6 rounded-xl shadow-lg">
                <div class="flex flex-col gap-4 mb-5">
                    <div class="flex items-center gap-2">
                        <div class="bg-green-100 p-2 rounded-lg">
                            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                        </div>
                        <h2 class="text-lg sm:text-xl font-bold text-gray-800">Data Kehadiran</h2>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-2 sm:gap-3">

                        <input type="date" id="dateFilter"

                        <div class="flex gap-2">
                            <button id="reset-btn"
                                class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-red-600 text-white font-semibold py-2.5 sm:py-3 px-3 sm:px-4 rounded-lg hover:bg-red-700 transition shadow-md hover:shadow-lg text-sm"
                                title="Reset Kehadiran">

                                    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0011.664 0l3.18-3.185m-3.18-3.182l-3.182 3.182m0 0a8.25 8.25 0 01-11.664 0l-3.18-3.185m3.18 3.182V6.108" />
                                </svg>
                                <span class="hidden sm:inline">Reset</span>
                            </button>

                            <button id="download-btn"
                                class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-green-600 text-white font-semibold py-2.5 sm:py-3 px-3 sm:px-4 rounded-lg hover:bg-green-700 transition shadow-md hover:shadow-lg text-sm"
                                title="Export ke Excel">
                                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                                <span class="hidden sm:inline">Export</span>
                            </button>

                    </div>
                </div>

                <div class="mobile-scroll rounded-lg border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gradient-to-r from-gray-50 to-gray-100">
                            <tr>
                                <th
                                    class="px-3 sm:px-4 py-3 sm:py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">
                                    Nama Anggota</th>
                                <th
                                    class="px-3 sm:px-4 py-3 sm:py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">
                                    Status</th>

                                    class="px-3 sm:px-4 py-3 sm:py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">
                                    Waktu</th>

                                    class="px-3 sm:px-4 py-3 sm:py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">

                            </tr>
                        </thead>
                        <tbody id="attendance-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>

                <div id="pagination-controls" class="flex items-center justify-between mt-5 gap-3">
                    <button id="prev-page-btn"
                        class="bg-gray-700 text-white font-semibold py-2.5 sm:py-3 px-4 sm:px-5 rounded-lg hover:bg-gray-800 transition shadow-md text-sm sm:text-base">

                    </button>

                    class="fixed top-5 right-5 z-50 flex items-center w-full max-w-xs p-4 space-x-4 text-gray-500 bg-white divide-x divide-gray-200 rounded-lg shadow-lg opacity-0 transform translate-x-12 transition-all duration-300 ease-in-out"

    <script>
        // --- Elemen DOM ---
        const dateFilter = document.getElementById('dateFilter');
        const tableBody = document.getElementById('attendance-table-body');
        const presenceToggle = document.getElementById('presence-toggle');
        const keamananToggle = document.getElementById('keamanan-toggle');
        const izinToggle = document.getElementById('izin-toggle');
        const sessionStatusText = document.getElementById('session-status-text');
        const scanButton = document.getElementById('scan-button');
        const scannerInfo = document.getElementById('scanner-info');
        const downloadBtn = document.getElementById('download-btn');
        const resetBtn = document.getElementById('reset-btn');
        const searchInput = document.getElementById('searchInput');
        const prevPageBtn = document.getElementById('prev-page-btn');
        const nextPageBtn = document.getElementById('next-page-btn');
        const pageInfo = document.getElementById('page-info');

        // --- State Management ---
        let currentRecords = [];
        let filteredRecords = [];
        let currentPage = 1;
        const rowsPerPage = 5;

        let html5QrCode = null;
        let isScannerRunning = false;

        // --- Fungsi Render Tabel & Paginasi ---
        const renderTable = () => {
            const searchTerm = searchInput.value.toLowerCase();

            filteredRecords = currentRecords.filter(record =>
                record.full_name.toLowerCase().includes(searchTerm)
            );

            const totalPages = Math.ceil(filteredRecords.length / rowsPerPage) || 1;
            currentPage = Math.min(currentPage, totalPages);
            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            const paginatedRecords = filteredRecords.slice(startIndex, endIndex);

            if (paginatedRecords.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-gray-500 text-sm sm:text-base">Tidak ada data ditemukan.</td></tr>';
            } else {
                const statusClasses = {
                    'Hadir': 'status-hadir', 'Tugas Pagi': 'status-tugas-pagi',
                    'Izin': 'status-izin', 'Sakit': 'status-sakit', 'Belum Hadir': 'status-belum-hadir'
                };
                tableBody.innerHTML = paginatedRecords.map(record => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-3 sm:px-4 py-3 sm:py-4"><div class="text-sm font-semibold text-gray-900">${record.full_name}</div><div class="text-xs text-gray-500 mt-0.5">${record.devisi || ''} / ${record.jabatan || ''}</div></td>
                    <td class="px-3 sm:px-4 py-3 sm:py-4"><span class="status-badge ${statusClasses[record.status] || ''}">${record.status}</span></td>
                    <td class="px-3 sm:px-4 py-3 sm:py-4 text-xs sm:text-sm text-gray-600 font-mono">${record.time || '-'}</td>
                    <td class="px-3 sm:px-4 py-3 sm:py-4">${(record.status === 'Izin' || record.status === 'Sakit') ? `<button class="view-reason-btn text-indigo-600 hover:underline text-xs sm:text-sm font-medium" data-reason="${record.reason || ''}">Lihat Alasan</button>` : '-'}</td>
                </tr>
            `).join('');
            }

            pageInfo.textContent = `Page ${currentPage}/${totalPages}`;
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage >= totalPages;

            prevPageBtn.classList.toggle('btn-disabled', currentPage === 1);
            nextPageBtn.classList.toggle('btn-disabled', currentPage >= totalPages);
        };

        // --- Fungsi Fetch Data ---
        // GANTI SELURUH FUNGSI onScanSuccess LAMA ANDA DENGAN INI

        // GANTI SELURUH FUNGSI loadAttendanceData LAMA ANDA DENGAN INI
        const loadAttendanceData = async (date) => {
            if (!date) {
                console.warn("[LOAD DATA] Date is not provided. Aborting fetch.");
                return;
            }
            console.log(`[LOAD DATA] Fetching records for date: ${date}`);
            tableBody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-gray-500">Memuat data terbaru...</td></tr>';

            try {
                const response = await fetch(`/api/records?date=${date}`);
                const data = await response.json();

                if (!response.ok) {
                    console.error("[LOAD DATA] Server returned an error:", data.error);
                    throw new Error(data.error || 'Gagal memuat data dari server');
                }

                console.log("[LOAD DATA] Successfully received data:", data);

                currentRecords = data;
                currentPage = 1; // Selalu reset ke halaman pertama saat data baru dimuat
                searchInput.value = ''; // Kosongkan pencarian
                renderTable(); // Panggil fungsi render
                console.log("[LOAD DATA] Table render complete.");

            } catch (error) {
                console.error("[LOAD DATA] Catched an error:", error);
                tableBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-500">Error: ${error.message}</td></tr>`;
                currentRecords = [];
                renderTable();
            }
        };
        // GANTI SELURUH FUNGSI onScanSuccess DENGAN VERSI FINAL INI

        let toastTimeout; // Variabel untuk mengelola timer notifikasi

        const showToast = (message, isSuccess = true) => {
            const toast = document.getElementById('notification-toast');
            const iconContainer = document.getElementById('toast-icon-container');
            const messageEl = document.getElementById('toast-message');

            // Hapus timer sebelumnya jika ada
            clearTimeout(toastTimeout);

            messageEl.textContent = message;

            if (isSuccess) {
                iconContainer.className = 'flex items-center justify-center w-10 h-10 rounded-lg bg-green-100 text-green-600';
                iconContainer.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            } else {
                iconContainer.className = 'flex items-center justify-center w-10 h-10 rounded-lg bg-red-100 text-red-600';
                iconContainer.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            }

            // Tampilkan toast
            toast.classList.remove('opacity-0', 'translate-x-12');
            toast.classList.add('opacity-100', 'translate-x-0');

            // Sembunyikan setelah 3 detik
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-x-0');
                toast.classList.add('opacity-0', 'translate-x-12');
            }, 3000);
        };


        const onScanSuccess = async (decodedText) => {
            // Hentikan scan sejenak untuk mencegah pemindaian ganda
            if (isScannerRunning) html5QrCode.pause();

            // Optimasi: Langsung kirim request tanpa loading popup
            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nipd: decodedText })
                });

                const result = await response.json();

                // Tampilkan notifikasi toast cepat
                showToast(result.message, response.ok);

                if (response.ok) {
                    // Getarkan perangkat jika sukses
                    if (window.navigator.vibrate) window.navigator.vibrate(100);

                    // Update UI secara langsung (Optimistic UI)
                    const recordIndex = currentRecords.findIndex(record => String(record.nipd) === String(result.nipd));
                    if (recordIndex !== -1) {
                        currentRecords[recordIndex].status = 'Hadir';
                        currentRecords[recordIndex].time = result.time;
                        renderTable();
                    } else {
                        // Fallback jika data tidak ditemukan di lokal
                        await loadAttendanceData(dateFilter.value);
                    }
                } else if (response.status === 409) {
                    // Jika sudah ada (konflik), tetap sinkronkan data untuk memastikan
                    await loadAttendanceData(dateFilter.value);
                }

            } catch (err) {
                console.error("Scan/Fetch Error:", err);
                showToast("Koneksi ke server gagal.", false);
            } finally {
                // Lanjutkan scan setelah jeda singkat (misal 1 detik)
                setTimeout(() => {
                    if (isScannerRunning) html5QrCode.resume();
                }, 1500);
            }
        };
        const startScanner = () => {
            if (!html5QrCode) html5QrCode = new Html5Qrcode("qr-reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess)
                .then(() => {
                    isScannerRunning = true;
                    scanButton.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>Hentikan Scan</span>';
                    scanButton.className = 'w-full bg-red-600 text-white font-bold py-3.5 sm:py-4 rounded-xl hover:bg-red-700 transition shadow-lg hover:shadow-xl text-base sm:text-lg';
                    scannerInfo.textContent = "Arahkan kamera ke QR Code.";
                }).catch(err => Swal.fire({ icon: 'error', title: 'Gagal Memulai Kamera', text: 'Pastikan Anda memberikan izin akses kamera.' }));
        };

        const stopScanner = () => {
            if (html5QrCode && isScannerRunning) {
                html5QrCode.stop().then(() => {
                    isScannerRunning = false;
                    scanButton.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>Mulai Scan</span>';
                    scanButton.className = 'w-full bg-indigo-600 text-white font-bold py-3.5 sm:py-4 rounded-xl hover:bg-indigo-700 transition shadow-lg hover:shadow-xl text-base sm:text-lg';
                    scannerInfo.textContent = "Kamera tidak aktif.";
                }).catch(err => console.warn("Gagal menghentikan scanner.", err));
            }
        };

        const loadSettings = async () => {
            try {
                const response = await fetch('/api/settings');
                const data = await response.json();
                if (response.ok) {
                    presenceToggle.checked = data.is_active;
                    keamananToggle.checked = data.is_keamanan_form_active;
                    izinToggle.checked = data.is_izin_form_active;
                    sessionStatusText.textContent = data.is_active ? 'Sesi Dibuka' : 'Sesi Ditutup';
                    sessionStatusText.className = data.is_active ? 'font-bold text-green-600 text-sm sm:text-base' : 'font-medium text-gray-700 text-sm sm:text-base';
                }
            } catch (error) { Swal.fire({ icon: 'error', title: 'Gagal memuat pengaturan.' }); }
        };

        const updateSetting = async (setting) => {
            try {
                const response = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(setting) });
                const result = await response.json();
                if (!result.success) throw new Error(result.message);
                Swal.fire({ icon: 'success', title: 'Pengaturan disimpan!', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
            } catch (error) {
                Swal.fire({ icon: 'error', title: `Gagal: ${error.message}` });
                loadSettings();
            }
        };

        const downloadXLSX = () => {
            const date = dateFilter.value;
            const dataToExport = filteredRecords.length > 0 ? filteredRecords : currentRecords;
            if (!date || dataToExport.length === 0) {
                Swal.fire({ icon: 'info', title: 'Tidak ada data untuk diekspor.' });
                return;
            }
            const dataForSheet = dataToExport.map(rec => ({
                'Nama Lengkap': rec.full_name, 'Devisi': rec.devisi || '', 'Jabatan/Sie': rec.jabatan || '',
                'Status': rec.status, 'Waktu': rec.time || '', 'Keterangan': rec.reason || ''
            }));
            const worksheet = XLSX.utils.json_to_sheet(dataForSheet);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Kehadiran');
            worksheet['!cols'] = [{ wch: 30 }, { wch: 20 }, { wch: 20 }, { wch: 15 }, { wch: 15 }, { wch: 40 }];
            XLSX.writeFile(workbook, `Laporan Kehadiran - ${date}.xlsx`);
        };

        const resetAttendanceData = async () => {
            const date = dateFilter.value;
            if (!date) {
                Swal.fire({ icon: 'warning', title: 'Pilih Tanggal', text: 'Silakan pilih tanggal yang ingin direset terlebih dahulu.' });
                return;
            }
            const confirmation = await Swal.fire({
                title: 'Anda Yakin?', text: `Semua data kehadiran pada tanggal ${date} akan dihapus. Aksi ini tidak dapat dibatalkan!`, icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6',
                confirmButtonText: 'Ya, reset data!', cancelButtonText: 'Batal'
            });
            if (confirmation.isConfirmed) {
                try {
                    Swal.fire({ title: 'Mereset data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    const response = await fetch(`/api/records?date=${date}`, { method: 'DELETE' });
                    const result = await response.json();
                    if (result.success) {
                        Swal.fire({ icon: 'success', title: 'Berhasil!', text: result.message });
                        loadAttendanceData(date);
                    } else { throw new Error(result.message); }
                } catch (error) {
                    Swal.fire({ icon: 'error', title: 'Gagal', text: error.message || 'Terjadi kesalahan saat menghubungi server.' });
                }
            }
        };

        // --- Event Listeners ---
        document.addEventListener('click', (e) => {
            if (e.target.closest('.copy-btn')) {
                const link = window.location.origin + e.target.closest('.copy-btn').dataset.link;
                navigator.clipboard.writeText(link).then(() => {
                    Swal.fire({ icon: 'success', title: 'Link disalin!', text: link, toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
                });
            }
            if (e.target.closest('.view-reason-btn')) {
                Swal.fire({ title: 'Alasan Keterangan', text: e.target.closest('.view-reason-btn').dataset.reason || 'Tidak ada alasan yang diberikan.', icon: 'info' });
            }
        });

        presenceToggle.addEventListener('change', () => updateSetting({ is_active: presenceToggle.checked }));
        keamananToggle.addEventListener('change', () => updateSetting({ is_keamanan_form_active: keamananToggle.checked }));
        izinToggle.addEventListener('change', () => updateSetting({ is_izin_form_active: izinToggle.checked }));
        scanButton.addEventListener('click', () => { isScannerRunning ? stopScanner() : startScanner(); });
        dateFilter.addEventListener('change', () => loadAttendanceData(dateFilter.value));
        downloadBtn.addEventListener('click', downloadXLSX);
        resetBtn.addEventListener('click', resetAttendanceData);
        document.getElementById('logoutButton').addEventListener('click', () => { fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/login'); });
        logoutButtonMobile.addEventListener('click', () => { fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/login'); });

        searchInput.addEventListener('input', () => {
            currentPage = 1;
            renderTable();
        });
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });
        nextPageBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredRecords.length / rowsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });

        window.addEventListener('load', () => {
            loadSettings();

            // PERBAIKAN FINAL: Mengambil tanggal berdasarkan zona waktu WITA
            const todayWITA = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Makassar" }));
            const year = todayWITA.getFullYear();
            const month = String(todayWITA.getMonth() + 1).padStart(2, '0'); // Months are 0-11
            const day = String(todayWITA.getDate()).padStart(2, '0');

            const dateStringWITA = `${year}-${month}-${day}`;

            dateFilter.value = dateStringWITA;
            loadAttendanceData(dateStringWITA);
        });
    </script>
</body>

</html>
