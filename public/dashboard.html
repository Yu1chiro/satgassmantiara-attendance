<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin Absensi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="https://ucarecdn.com/382b5c5d-8bae-48d2-b42d-f22a93bbff77/468556946_545462784956500_3658096931176580766_n.jpg" type="image/x-icon">
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; }
        .toggle-checkbox { left: 0; transition: all 0.2s ease-in-out; }
        .toggle-label { transition: background-color 0.2s ease-in-out; }
        .toggle-checkbox:checked { left: calc(100% - 1.5rem); border-color: #4f46e5; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4f46e5; }
        #qr-reader { border: 2px dashed #cbd5e1; border-radius: 0.5rem; }
        #qr-reader__dashboard_section_swaplink, #qr-reader__dashboard_section_fsr { display: none !important; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; }
        .status-hadir { background-color: #dcfce7; color: #166534; }
        .status-tugas-pagi { background-color: #cffafe; color: #0891b2; }
        .status-izin, .status-sakit { background-color: #feefc7; color: #92400e; }
        .status-belum-hadir { background-color: #fce7f3; color: #be185d; }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-100">

    <div class="p-4 sm:p-6 lg:p-8">
       <header class="flex justify-between items-center mb-8">
    <h1 class="text-xl font-bold text-gray-800">Hello Admin!</h1>

    <nav class="hidden sm:flex items-center gap-2">
        <a href="/generate" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition">Generate QR</a>
        <a href="/documentation" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition">Dokumentasi</a>
        <button id="logoutButton" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-700 transition">Logout</button>
    </nav>

    <div class="sm:hidden">
        <button id="menu-btn" class="p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500">
            <svg class="w-6 h-6 text-gray-800" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </button>
    </div>
</header>

<div id="mobile-menu" class="fixed top-0 right-0 h-full w-64 bg-white shadow-xl transform translate-x-full transition-transform duration-300 ease-in-out z-50">
    <div class="flex justify-end p-4">
        <button id="close-btn" class="p-2">
            <svg class="w-6 h-6 text-gray-800" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    <nav class="flex flex-col p-4 space-y-4">
        <a href="/generate" class="text-gray-700 hover:bg-gray-100 py-2 px-4 rounded-lg transition">Generate QR</a>
        <a href="/documentation" class="text-gray-700 hover:bg-gray-100 py-2 px-4 rounded-lg transition">Dokumentasi</a>
        <button id="logoutButtonMobile" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-700 transition">Logout</button>
    </nav>
</div>
<script>
    // --- Elemen & Event Listener untuk Navbar Mobile ---
const menuBtn = document.getElementById('menu-btn');
const mobileMenu = document.getElementById('mobile-menu');
const closeBtn = document.getElementById('close-btn');
const logoutButtonMobile = document.getElementById('logoutButtonMobile');

menuBtn.addEventListener('click', () => {
    mobileMenu.classList.remove('translate-x-full'); // Tampilkan menu
});

closeBtn.addEventListener('click', () => {
    mobileMenu.classList.add('translate-x-full'); // Sembunyikan menu
});
</script>
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg h-fit space-y-6">
                <h2 class="text-xl font-bold">Panel Kontrol</h2>
                  <div class="space-y-4 pt-4 border-t">
                      <h3 class="font-bold text-gray-800">Pemindai QR Code</h3>
                      <div id="qr-reader" class="w-full bg-gray-50"></div>
                      <p id="scanner-info" class="text-center text-sm text-gray-500">Kamera tidak aktif.</p>
                      <button id="scan-button" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">Mulai Scan</button>
                  </div>
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-4">
                    <h3 class="font-bold text-gray-800">Sesi Pindai QR</h3>
                    <div class="flex items-center justify-between">
                        <span id="session-status-text" class="font-medium text-gray-700">Sesi Ditutup</span>
                        <div class="relative inline-block w-10 align-middle">
                            <input type="checkbox" id="presence-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                            <label for="presence-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-4">
                    <h3 class="font-bold text-gray-800">Presensi Khusus</h3>
                    <div class="hidden flex items-center justify-between">
                        <label for="keamanan-toggle" class="font-medium text-gray-700">Presensi Kamtib</label>
                        <div class="relative inline-block w-10 align-middle"><input type="checkbox" id="keamanan-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/><label for="keamanan-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label></div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label for="izin-toggle" class="font-medium text-gray-700">Presensi Izin/Sakit</label>
                        <div class="relative inline-block w-10 align-middle"><input type="checkbox" id="izin-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/><label for="izin-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label></div>
                    </div>
                    <div class="text-xs text-gray-600 space-y-2 pt-2 border-t">
                        <p><button class="copy-btn hidden font-mono text-indigo-600" data-link="/presensi-kamtibsis">Presensi kamtibsis</button></p>
                        <p>Bagikan link ini: <button class="copy-btn font-mono text-indigo-600" data-link="/presensi-izin-sakit">Presensi izin & sakit</button></p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-lg">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                       <h2 class="text-xl font-bold">Data Kehadiran</h2>
                       <div class="flex items-center gap-2 w-full sm:w-auto">
                            <input type="search" id="searchInput" placeholder="Cari nama..." class="p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-auto">
                           
                            <input type="date" id="dateFilter" class="p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            
                            <button id="reset-btn" class="flex items-center justify-center gap-2 bg-red-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-700 transition" title="Reset Kehadiran">
                                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0011.664 0l3.18-3.185m-3.18-3.182l-3.182 3.182m0 0a8.25 8.25 0 01-11.664 0l-3.18-3.185m3.18 3.182V6.108" /></svg>
                            </button>
                            
                            <button id="download-btn" class="flex items-center justify-center gap-2 bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 transition" title="Export ke Excel">
                               <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            </button>
                       </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Nama Anggota</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Waktu</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
                
                <div id="pagination-controls" class="flex items-center justify-between mt-4">
                    <button id="prev-page-btn" class="bg-gray-700 text-white font-semibold py-2 px-4 rounded-lg hover:bg-gray-800 transition">Prev</button>
                    <span id="page-info" class="text-sm font-medium text-gray-700"></span>
                    <button id="next-page-btn" class="bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 transition">Next</button>
                </div>

            </div>
        </main>
    </div>

<script>
    // --- Elemen DOM ---
    const dateFilter = document.getElementById('dateFilter');
    const tableBody = document.getElementById('attendance-table-body');
    const presenceToggle = document.getElementById('presence-toggle');
    const keamananToggle = document.getElementById('keamanan-toggle');
    const izinToggle = document.getElementById('izin-toggle');
    const sessionStatusText = document.getElementById('session-status-text');
    const scanButton = document.getElementById('scan-button');
    const scannerInfo = document.getElementById('scanner-info');
    const downloadBtn = document.getElementById('download-btn');
    const resetBtn = document.getElementById('reset-btn');
    const searchInput = document.getElementById('searchInput'); // BARU
    const prevPageBtn = document.getElementById('prev-page-btn'); // BARU
    const nextPageBtn = document.getElementById('next-page-btn'); // BARU
    const pageInfo = document.getElementById('page-info'); // BARU

    // --- State Management ---
    let currentRecords = []; // Data asli dari server
    let filteredRecords = []; // Data setelah difilter pencarian
    let currentPage = 1; // Halaman saat ini
    const rowsPerPage = 5; // Jumlah data per halaman
    
    let html5QrCode = null;
    let isScannerRunning = false;
    
    // --- Fungsi Render Tabel & Paginasi ---
    const renderTable = () => {
        const searchTerm = searchInput.value.toLowerCase();
        
        // 1. Filter data berdasarkan pencarian
        filteredRecords = currentRecords.filter(record => 
            record.full_name.toLowerCase().includes(searchTerm)
        );

        // 2. Kalkulasi Paginasi
        const totalPages = Math.ceil(filteredRecords.length / rowsPerPage) || 1;
        currentPage = Math.min(currentPage, totalPages); // Pastikan currentPage valid
        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const paginatedRecords = filteredRecords.slice(startIndex, endIndex);

        // 3. Render Baris Tabel
        if (paginatedRecords.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Tidak ada data ditemukan.</td></tr>';
        } else {
            const statusClasses = {
                'Hadir': 'status-hadir', 'Tugas Pagi': 'status-tugas-pagi',
                'Izin': 'status-izin', 'Sakit': 'status-sakit', 'Belum Hadir': 'status-belum-hadir'
            };
            tableBody.innerHTML = paginatedRecords.map(record => `
                <tr>
                    <td class="px-4 py-3"><div class="text-sm font-medium text-gray-900">${record.full_name}</div><div class="text-xs text-gray-500">${record.devisi || ''} / ${record.jabatan || ''}</div></td>
                    <td class="px-4 py-3"><span class="status-badge ${statusClasses[record.status] || ''}">${record.status}</span></td>
                    <td class="px-4 py-3 text-sm text-gray-600 font-mono">${record.time || '-'}</td>
                    <td class="px-4 py-3">${(record.status === 'Izin' || record.status === 'Sakit') ? `<button class="view-reason-btn text-indigo-600 hover:underline text-sm" data-reason="${record.reason || ''}">Lihat Alasan</button>` : '-'}</td>
                </tr>
            `).join('');
        }

        // 4. Update Kontrol Paginasi
        pageInfo.textContent = `Page ${currentPage}/${totalPages}`;
        prevPageBtn.disabled = currentPage === 1;
        nextPageBtn.disabled = currentPage >= totalPages;
        
        prevPageBtn.classList.toggle('btn-disabled', currentPage === 1);
        nextPageBtn.classList.toggle('btn-disabled', currentPage >= totalPages);
    };

    // --- Fungsi Fetch Data ---
    const loadAttendanceData = async (date) => {
        if (!date) return;
        tableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Memuat data...</td></tr>';
        try {
            const response = await fetch(`/api/records?date=${date}`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Gagal memuat data');
            
            currentRecords = data;
            currentPage = 1; // Reset ke halaman pertama setiap kali data baru dimuat
            searchInput.value = ''; // Reset pencarian
            renderTable(); // Panggil fungsi render baru
        } catch (error) { 
            tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Error: ${error.message}</td></tr>`;
            currentRecords = [];
            renderTable();
        }
    };
    
    // --- Fungsi Lainnya (Scanner, Settings, Export, dll) ---
    const onScanSuccess = async (decodedText) => {
        if (isScannerRunning) html5QrCode.pause();
        Swal.fire({ title: 'Memproses Kehadiran...', text: `NIPD: ${decodedText}`, allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try {
            const response = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nipd: decodedText }) });
            const result = await response.json();
            await Swal.fire({ icon: result.success ? 'success' : 'error', title: result.success ? 'Berhasil!' : 'Gagal!', text: result.message, timer: result.success ? 2000 : 3000, showConfirmButton: !result.success });
            if (result.success) {
                if (window.navigator.vibrate) window.navigator.vibrate(100);
                loadAttendanceData(dateFilter.value);
            }
        } catch (err) {
            await Swal.fire({ icon: 'error', title: 'Koneksi Error', text: 'Gagal menghubungi server.' });
        } finally {
            if (isScannerRunning) html5QrCode.resume();
        }
    };

    const startScanner = () => {
        if (!html5QrCode) html5QrCode = new Html5Qrcode("qr-reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess)
            .then(() => {
                isScannerRunning = true;
                scanButton.textContent = 'Hentikan Scan';
                scanButton.className = 'w-full bg-red-600 text-white font-semibold py-3 rounded-lg hover:bg-red-700 transition';
                scannerInfo.textContent = "Arahkan kamera ke QR Code.";
            }).catch(err => Swal.fire({ icon: 'error', title: 'Gagal Memulai Kamera', text: 'Pastikan Anda memberikan izin akses kamera.' }));
    };

    const stopScanner = () => {
        if (html5QrCode && isScannerRunning) {
            html5QrCode.stop().then(() => {
                isScannerRunning = false;
                scanButton.textContent = 'Mulai Scan';
                scanButton.className = 'w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition';
                scannerInfo.textContent = "Kamera tidak aktif.";
            }).catch(err => console.warn("Gagal menghentikan scanner.", err));
        }
    };
    
    const loadSettings = async () => {
        try {
            const response = await fetch('/api/settings');
            const data = await response.json();
            if (response.ok) {
                presenceToggle.checked = data.is_active;
                keamananToggle.checked = data.is_keamanan_form_active;
                izinToggle.checked = data.is_izin_form_active;
                sessionStatusText.textContent = data.is_active ? 'Sesi Dibuka' : 'Sesi Ditutup';
                sessionStatusText.className = data.is_active ? 'font-bold text-green-600' : 'font-medium text-gray-700';
            }
        } catch (error) { Swal.fire({ icon: 'error', title: 'Gagal memuat pengaturan.' }); }
    };
    
    const updateSetting = async (setting) => {
        try {
            const response = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(setting) });
            const result = await response.json();
            if (!result.success) throw new Error(result.message);
            Swal.fire({ icon: 'success', title: 'Pengaturan disimpan!', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
        } catch (error) {
            Swal.fire({ icon: 'error', title: `Gagal: ${error.message}` });
            loadSettings();
        }
    };

    const downloadXLSX = () => {
        const date = dateFilter.value;
        const dataToExport = filteredRecords.length > 0 ? filteredRecords : currentRecords; // Ekspor data yang difilter jika ada
        if (!date || dataToExport.length === 0) {
            Swal.fire({ icon: 'info', title: 'Tidak ada data untuk diekspor.' });
            return;
        }
        const dataForSheet = dataToExport.map(rec => ({
            'Nama Lengkap': rec.full_name, 'Devisi': rec.devisi || '', 'Jabatan/Sie': rec.jabatan || '',
            'Status': rec.status, 'Waktu': rec.time || '', 'Keterangan': rec.reason || ''
        }));
        const worksheet = XLSX.utils.json_to_sheet(dataForSheet);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Kehadiran');
        worksheet['!cols'] = [ { wch: 30 }, { wch: 20 }, { wch: 20 }, { wch: 15 }, { wch: 15 }, { wch: 40 } ];
        XLSX.writeFile(workbook, `Laporan Kehadiran - ${date}.xlsx`);
    };

    const resetAttendanceData = async () => {
        const date = dateFilter.value;
        if (!date) {
            Swal.fire({ icon: 'warning', title: 'Pilih Tanggal', text: 'Silakan pilih tanggal yang ingin direset terlebih dahulu.' });
            return;
        }
        const confirmation = await Swal.fire({
            title: 'Anda Yakin?', text: `Semua data kehadiran pada tanggal ${date} akan dihapus. Aksi ini tidak dapat dibatalkan!`, icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6',
            confirmButtonText: 'Ya, reset data!', cancelButtonText: 'Batal'
        });
        if (confirmation.isConfirmed) {
            try {
                Swal.fire({ title: 'Mereset data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const response = await fetch(`/api/records?date=${date}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    Swal.fire({ icon: 'success', title: 'Berhasil!', text: result.message });
                    loadAttendanceData(date);
                } else { throw new Error(result.message); }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Gagal', text: error.message || 'Terjadi kesalahan saat menghubungi server.' });
            }
        }
    };
    
    // --- Event Listeners ---
    document.addEventListener('click', (e) => {
        if (e.target.closest('.copy-btn')) {
            const link = window.location.origin + e.target.closest('.copy-btn').dataset.link;
            navigator.clipboard.writeText(link).then(() => {
                Swal.fire({ icon: 'success', title: 'Link disalin!', text: link, toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
            });
        }
        if (e.target.closest('.view-reason-btn')) {
            Swal.fire({ title: 'Alasan Keterangan', text: e.target.closest('.view-reason-btn').dataset.reason || 'Tidak ada alasan yang diberikan.', icon: 'info' });
        }
    });

    presenceToggle.addEventListener('change', () => updateSetting({ is_active: presenceToggle.checked }));
    keamananToggle.addEventListener('change', () => updateSetting({ is_keamanan_form_active: keamananToggle.checked }));
    izinToggle.addEventListener('change', () => updateSetting({ is_izin_form_active: izinToggle.checked }));
    scanButton.addEventListener('click', () => { isScannerRunning ? stopScanner() : startScanner(); });
    dateFilter.addEventListener('change', () => loadAttendanceData(dateFilter.value));
    downloadBtn.addEventListener('click', downloadXLSX);
    resetBtn.addEventListener('click', resetAttendanceData);
    document.getElementById('logoutButton').addEventListener('click', () => { fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/login'); });

    // Event Listeners BARU
    searchInput.addEventListener('input', () => {
        currentPage = 1; // Kembali ke halaman pertama setiap kali mencari
        renderTable();
    });
    prevPageBtn.addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            renderTable();
        }
    });
    nextPageBtn.addEventListener('click', () => {
        const totalPages = Math.ceil(filteredRecords.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderTable();
        }
    });

    window.addEventListener('load', () => {
        loadSettings();
        const today = new Date();
        today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
        dateFilter.value = today.toISOString().split('T')[0];
        loadAttendanceData(dateFilter.value);
    });
</script>
</body>
</html>
