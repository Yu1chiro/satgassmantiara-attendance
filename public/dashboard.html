<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        .swal2-html-container {
            text-align: left !important;
            margin-left: 1.5rem !important;
            margin-right: 1.5rem !important;
        }
        .detail-label {
            font-weight: 600;
            color: #4b5563;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4f46e5;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4f46e5;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="p-4 sm:p-6 lg:p-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Admin Dashboard</h1>
            <button id="logoutButton" class="bg-red-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-600 transition">Logout</button>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg h-fit">
                <h2 class="text-xl font-bold mb-6">Pengaturan Absensi</h2>
                <form id="settingsForm" class="space-y-6">
                    <div class="flex items-center justify-between">
                        <label for="presence-toggle" class="block font-medium text-gray-700">Status Presensi</label>
                        <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="presence-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                            <label for="presence-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                        </div>
                    </div>
                    
                    <div id="settings-fields" class="space-y-4 transition-opacity duration-500">
                        <div>
                            <label for="latitude" class="block text-sm font-medium text-gray-600">Latitude Target</label>
                            <input type="number" step="any" id="latitude" required class="mt-1 w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label for="longitude" class="block text-sm font-medium text-gray-600">Longitude Target</label>
                            <input type="number" step="any" id="longitude" required class="mt-1 w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label for="deadline" class="block text-sm font-medium text-gray-600">Batas Waktu (WITA)</label>
                            <input type="datetime-local" id="deadline" required class="mt-1 w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">Simpan Pengaturan</button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-lg">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                     <h2 class="text-xl font-bold">Data Kehadiran</h2>
                     <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 w-full sm:w-auto">
                        <input type="date" id="dateFilter" class="p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full">
                        <div class="flex gap-2">
                           <button id="download-presence-btn" class="w-1/2 sm:w-auto flex items-center justify-center gap-2 bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                Presensi
                            </button>
                             <button id="download-late-btn" class="w-1/2 sm:w-auto flex items-center justify-center gap-2 bg-yellow-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-yellow-600 transition">
                               <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                Terlambat
                            </button>
                        </div>
                     </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Nama</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Waktu</th>
                                <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

<script>
    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true
    });

    const settingsForm = document.getElementById('settingsForm');
    const latitudeInput = document.getElementById('latitude');
    const longitudeInput = document.getElementById('longitude');
    const deadlineInput = document.getElementById('deadline');
    const dateFilter = document.getElementById('dateFilter');
    const tableBody = document.getElementById('attendance-table-body');
    const logoutButton = document.getElementById('logoutButton');
    const presenceToggle = document.getElementById('presence-toggle');
    const settingsFields = document.getElementById('settings-fields');
    const downloadPresenceBtn = document.getElementById('download-presence-btn');
    const downloadLateBtn = document.getElementById('download-late-btn');

    let currentRecords = [];

    const toggleSettingsFields = (isActive) => {
        if (isActive) {
            settingsFields.style.opacity = '1';
            settingsFields.style.pointerEvents = 'auto';
            latitudeInput.required = true; longitudeInput.required = true; deadlineInput.required = true;
        } else {
            settingsFields.style.opacity = '0.5';
            settingsFields.style.pointerEvents = 'none';
            latitudeInput.required = false; longitudeInput.required = false; deadlineInput.required = false;
        }
    };
    
    const loadSettings = async () => {
        try {
            const response = await fetch('/api/settings');
            const data = await response.json();
            if (response.ok) {
                presenceToggle.checked = data.is_active;
                toggleSettingsFields(data.is_active);
                latitudeInput.value = data.target_latitude || '';
                longitudeInput.value = data.target_longitude || '';
                if (data.deadline_time) {
                    const deadlineDate = new Date(data.deadline_time);
                    const year = deadlineDate.getFullYear();
                    const month = String(deadlineDate.getMonth() + 1).padStart(2, '0');
                    const day = String(deadlineDate.getDate()).padStart(2, '0');
                    const hours = String(deadlineDate.getHours()).padStart(2, '0');
                    const minutes = String(deadlineDate.getMinutes()).padStart(2, '0');
                    deadlineInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
                }
            } else {
                Toast.fire({ icon: 'error', title: 'Gagal memuat pengaturan.' });
            }
        } catch (error) {
            Toast.fire({ icon: 'error', title: 'Error koneksi saat memuat pengaturan.' });
        }
    };

    const loadAttendanceData = async (date) => {
        if (!date) return;
        tableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Memuat data...</td></tr>';
        
        try {
            const response = await fetch(`/api/records?date=${date}`);
            const data = await response.json();
            
            if (!response.ok) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Error: ${data.error}</td></tr>`;
                currentRecords = [];
                return;
            }

            currentRecords = data;
            
            if (data.length === 0) {
                 tableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Tidak ada data untuk tanggal ini.</td></tr>';
                 return;
            }
            
            let rows = '';
            data.forEach(record => {
                let statusClass = '';
                switch(record.status) {
                    case 'Hadir': statusClass = 'bg-green-100 text-green-800'; break;
                    case 'Terlambat': statusClass = 'bg-yellow-100 text-yellow-800'; break;
                    case 'Tidak Hadir': statusClass = 'bg-red-100 text-red-800'; break;
                    default: statusClass = 'bg-gray-100 text-gray-800';
                }

                const dataAttributes = `
                    data-id="${record.id}" data-fullname="${record.full_name}" data-class="${record.student_class}"
                    data-division="${record.division}" data-status="${record.status}" data-reason="${record.reason || ''}"
                    data-lat="${record.user_latitude || ''}" data-lon="${record.user_longitude || ''}"
                `;

                rows += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${record.full_name}</div>
                            <div class="text-xs text-gray-500">${record.student_class} / ${record.division}</div>
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">${record.status}</span>
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${record.time}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium space-x-2">
                            <button class="text-indigo-600 hover:text-indigo-900 view-detail-btn" ${dataAttributes}>Detail</button>
                            <button class="text-red-600 hover:text-red-900 delete-btn" data-id="${record.id}">Hapus</button>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = rows;

        } catch (error) {
             tableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">Terjadi kesalahan jaringan.</td></tr>';
             currentRecords = [];
        }
    };

    const downloadCSV = (data, filename) => {
        if (!data || data.length === 0) {
            Toast.fire({ icon: 'info', title: 'Tidak ada data untuk diunduh pada kategori ini.' });
            return;
        }

        const headers = Object.keys(data[0]);
        const csvRows = [headers.join(',')];

        for (const row of data) {
            const values = headers.map(header => {
                const value = row[header] === null || row[header] === undefined ? '' : row[header];
                const escaped = ('' + value).replace(/"/g, '""');
                return `"${escaped}"`;
            });
            csvRows.push(values.join(','));
        }

        const csvString = csvRows.join('\n');
        const blob = new Blob([`\uFEFF${csvString}`], { type: 'text/csv;charset=utf-8;' }); // \uFEFF for Excel compatibility
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    };

    settingsForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (presenceToggle.checked && !deadlineInput.value) {
            Toast.fire({ icon: 'error', title: 'Jika presensi aktif, batas waktu wajib diisi.' });
            return;
        }
        const dateObject = new Date(deadlineInput.value || '1970-01-01T00:00');
        const deadlineInUTC = dateObject.toISOString();
        const settingsData = {
            latitude: latitudeInput.value,
            longitude: longitudeInput.value,
            deadline: deadlineInUTC,
            is_active: presenceToggle.checked
        };
        try {
            const response = await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settingsData)
            });
            const result = await response.json();
            Toast.fire({ icon: result.success ? 'success' : 'error', title: result.message });
        } catch (error) {
             Toast.fire({ icon: 'error', title: 'Terjadi kesalahan jaringan.' });
        }
    });

    dateFilter.addEventListener('change', () => loadAttendanceData(dateFilter.value));
    
    logoutButton.addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' });
        Toast.fire({ icon: 'success', title: 'Logout berhasil!' });
        setTimeout(() => window.location.href = '/login.html', 1500);
    });

    presenceToggle.addEventListener('change', () => {
        toggleSettingsFields(presenceToggle.checked);
    });

    tableBody.addEventListener('click', async (e) => {
        const target = e.target;
        const recordData = target.dataset;
        if (target.classList.contains('delete-btn')) {
            Swal.fire({
                title: 'Apakah Anda yakin?', text: "Data yang dihapus tidak dapat dikembalikan!", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6',
                confirmButtonText: 'Ya, hapus!', cancelButtonText: 'Batal'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch(`/api/records/${recordData.id}`, { method: 'DELETE' });
                        const resJson = await response.json();
                        Toast.fire({ icon: resJson.success ? 'success' : 'error', title: resJson.message });
                        if(resJson.success) { loadAttendanceData(dateFilter.value); }
                    } catch (err) { Toast.fire({ icon: 'error', title: 'Gagal menghubungi server.' }); }
                }
            })
        }
        if (target.classList.contains('view-detail-btn')) {
            let detailContent = `<div><span class="detail-label">Nama:</span> ${recordData.fullname}</div>
                <div><span class="detail-label">Kelas:</span> ${recordData.class}</div>
                <div><span class="detail-label">Devisi:</span> ${recordData.division}</div><hr class="my-3">`;
            if (recordData.status === 'Terlambat') {
                detailContent += `<div><span class="detail-label">Alasan Terlambat:</span></div><p>${recordData.reason || 'Tidak ada alasan.'}</p>`;
            } else if (recordData.status === 'Tidak Hadir') {
                const mapsLink = `https://www.google.com/maps?q=${recordData.lat},${recordData.lon}`;
                detailContent += `<div><span class="detail-label">Absen dari Lokasi:</span></div>
                    <p>Latitude: ${recordData.lat}</p><p>Longitude: ${recordData.lon}</p>
                    <a href="${mapsLink}" target="_blank" class="text-indigo-600 hover:underline">Lihat di Google Maps</a>`;
            } else {
                 detailContent += `<div><span class="detail-label">Status:</span> Hadir Tepat Waktu.</div>`;
            }
            Swal.fire({
                title: `<strong>Detail Absensi</strong>`, icon: 'info', html: detailContent,
                showCloseButton: true, focusConfirm: false, confirmButtonText: 'Tutup'
            });
        }
    });

    downloadPresenceBtn.addEventListener('click', () => {
        const date = dateFilter.value;
        if (!date) { Toast.fire({ icon: 'error', title: 'Silakan pilih tanggal terlebih dahulu.' }); return; }
        const presenceData = currentRecords
            .filter(rec => rec.status === 'Hadir' || rec.status === 'Tidak Hadir')
            .map(rec => ({
                 'Waktu Presensi': rec.time, 'Nama Lengkap': rec.full_name, 'Kelas': rec.student_class,
                'Bidang/Divisi': rec.division, 'Status Kehadiran': rec.status
            }));
        downloadCSV(presenceData, `presensi_${date}.csv`);
    });

    downloadLateBtn.addEventListener('click', () => {
        const date = dateFilter.value;
        if (!date) { Toast.fire({ icon: 'error', title: 'Silakan pilih tanggal terlebih dahulu.' }); return; }
        const lateData = currentRecords
            .filter(rec => rec.status === 'Terlambat')
            .map(rec => ({
               'Waktu Presensi': rec.time,  'Nama Lengkap': rec.full_name, 'Kelas': rec.student_class,
                'Bidang/Divisi': rec.division, 'Alasan': rec.reason
            }));
        downloadCSV(lateData, `terlambat_${date}.csv`);
    });

    window.addEventListener('load', () => {
        loadSettings();
        const today = new Date();
        today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
        dateFilter.value = today.toISOString().split('T')[0];
        loadAttendanceData(dateFilter.value);
    });
</script>

</body>
</html>
