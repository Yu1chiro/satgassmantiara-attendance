<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate QR Code - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .qr-card { 
            border: 1px solid #e5e7eb;
        }
        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 no-print">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Generate QR Code Anggota</h1>
                <p class="text-gray-600">Buat dan unduh QR code untuk name tag anggota Satgas OSIS.</p>
            </div>
            <div class="mt-4 sm:mt-0">
                <a href="/dashboard" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700 transition mr-2">
                    &larr; Kembali ke Dashboard
                </a>
                <button id="download-all-btn" class="bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 transition">
                    🖼️ Download Semua (Gambar)
                </button>
            </div>
        </header>

        <main id="print-area" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div id="loading-state" class="col-span-full text-center p-10 text-gray-500">
                Memuat data anggota...
            </div>
        </main>
    </div>

<script>
    const printArea = document.getElementById('print-area');
    const loadingState = document.getElementById('loading-state');
    const downloadAllBtn = document.getElementById('download-all-btn');

    const loadMembersAndGenerateQRs = async () => {
        downloadAllBtn.disabled = true;
        downloadAllBtn.classList.add('btn-disabled');

        try {
            const response = await fetch('/api/admin/members');
            if (!response.ok) throw new Error('Gagal mengambil data anggota');
            
            const members = await response.json();
            loadingState.style.display = 'none';

            if (members.length === 0) {
                printArea.innerHTML = '<p class="col-span-full text-center">Tidak ada data anggota untuk ditampilkan.</p>';
                return;
            }

            const imageLoadPromises = members.map(member => {
                return new Promise(async (resolve, reject) => {
                    const card = document.createElement('div');
                    card.className = 'qr-card bg-white p-4 rounded-lg flex flex-col items-center text-center shadow-lg';
                    // DIUBAH: Menambahkan data-name dan data-nipd untuk nanti digunakan saat download
                    card.setAttribute('data-name', member.full_name);
                    card.setAttribute('data-nipd', member.nipd);

                    const qrImg = document.createElement('img');
                    qrImg.alt = `QR Code untuk ${member.full_name}`;
                    qrImg.className = 'w-48 h-48 object-contain mb-3';
                    
                    qrImg.onload = () => resolve();
                    qrImg.onerror = () => reject(new Error(`Gagal memuat QR untuk ${member.full_name}`));
                    
                    const nameEl = document.createElement('p');
                    nameEl.className = 'font-semibold text-base text-gray-800 leading-tight';
                    nameEl.textContent = member.full_name;
                    
                    const idEl = document.createElement('p');
                    idEl.className = 'text-sm text-gray-500 font-mono mt-1';
                    idEl.textContent = member.nipd;

                    card.appendChild(qrImg);
                    card.appendChild(nameEl);
                    card.appendChild(idEl);
                    printArea.appendChild(card);
                    
                    try {
                        const qrResponse = await fetch(`/api/generate-qr?nipd=${member.nipd}`);
                        const qrData = await qrResponse.json();
                        qrImg.src = qrData.qr_code_url;
                    } catch (e) {
                        reject(e);
                    }
                });
            });
            
            await Promise.all(imageLoadPromises);
            
            downloadAllBtn.disabled = false;
            downloadAllBtn.classList.remove('btn-disabled');

        } catch (error) {
            loadingState.textContent = `Terjadi kesalahan: ${error.message}`;
            loadingState.className = 'col-span-full text-center p-10 text-red-500';
        }
    };

    // --- FUNGSI DOWNLOAD BARU DENGAN CANVAS ---
    const downloadAllQRsAsImages = async () => {
        const cards = document.querySelectorAll('.qr-card');
        if (cards.length === 0) {
            Swal.fire('Oops!', 'Tidak ada gambar untuk diunduh.', 'info');
            return;
        }

        Swal.fire({
            title: 'Proses Unduh Dimulai',
            text: `Browser akan meminta izin untuk mengunduh beberapa file. Mohon klik "Izinkan".`,
            icon: 'info',
            timer: 4000,
            showConfirmButton: false
        });

        const delay = ms => new Promise(res => setTimeout(res, ms));

        for (const card of cards) {
            const imgElement = card.querySelector('img');
            const memberName = card.getAttribute('data-name');
            const memberNipd = card.getAttribute('data-nipd');
            
            if (imgElement && imgElement.complete && memberName && memberNipd) {
                // Membuat canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // Pengaturan dimensi kartu
                const cardWidth = 300;
                const cardHeight = 400;
                const padding = 20;
                const qrSize = 220;

                canvas.width = cardWidth;
                canvas.height = cardHeight;

                // 1. Gambar latar belakang putih
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, cardWidth, cardHeight);

                // 2. Gambar QR Code
                const qrX = (cardWidth - qrSize) / 2;
                const qrY = padding;
                ctx.drawImage(imgElement, qrX, qrY, qrSize, qrSize);

                // 3. Tulis Nama Anggota
                ctx.fillStyle = '#1f2937'; // text-gray-800
                ctx.font = 'bold 18px Inter, sans-serif';
                ctx.textAlign = 'center';
                const nameY = qrY + qrSize + 35; // Posisi Y untuk nama
                ctx.fillText(memberName, cardWidth / 2, nameY);

                // 4. Tulis NIPD Anggota
                ctx.fillStyle = '#6b7280'; // text-gray-500
                ctx.font = '16px "Courier New", monospace';
                const nipdY = nameY + 25; // Posisi Y untuk NIPD
                ctx.fillText(memberNipd, cardWidth / 2, nipdY);

                // Membuat nama file yang aman
                const fileName = memberName.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.png';
                
                // Memicu download dari data canvas
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                await delay(200); 
            }
        }
    };

    window.addEventListener('load', loadMembersAndGenerateQRs);
    downloadAllBtn.addEventListener('click', downloadAllQRsAsImages);
</script>
</body>
</html>
